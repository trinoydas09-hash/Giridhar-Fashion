        <!-- Crease & pleats -->
        <line x1="-58" y1="-185" x2="-68" y2="210" stroke="#8F806E" stroke-width="1.4" opacity="0.5" />
        <line x1="-42" y1="-185" x2="-46" y2="-130" stroke="#8F806E" stroke-width="1.4" opacity="0.6" />
        <line x1="58" y1="-185" x2="68" y2="210" stroke="#8F806E" stroke-width="1.4" opacity="0.5" />
        <line x1="42" y1="-185" x2="46" y2="-130" stroke="#8F806E" stroke-width="1.4" opacity="0.6" />
        <!-- Side tab brass buckle -->
        <rect x="-92" y="-206" width="18" height="10" fill="none" stroke="#173D32" stroke-width="2" />
        <rect x="74" y="-206" width="18" height="10" fill="none" stroke="#173D32" stroke-width="2" />
