<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="studioLight" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FAF8F3" />
      <stop offset="100%" stop-color="#EAE3D5" />
    </radialGradient>
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 4 H8 M4 0 V8" stroke="#173D32" stroke-width="0.35" opacity="0.06" />
    </pattern>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#173D32" flood-opacity="0.14" />
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#studioLight)" />
  <rect width="800" height="600" fill="url(#weave)" />
  <rect x="28" y="28" width="744" height="544" fill="none" stroke="#173D32" stroke-opacity="0.08" stroke-width="1" />
  <g filter="url(#softShadow)">
    
      <g transform="translate(400, 315) scale(0.75)">
        <!-- Shirt body -->
        <path d="M-42,-215 L42,-215 L105,-185 L195,-75 L155,-32 L105,-88 L105,195 C45,212 -45,212 -105,195 L-105,-88 L-155,-32 L-195,-75 L-105,-185 Z"
              fill="#173D32" stroke="#0E2720" stroke-width="2" />
        <!-- Mandarin collar -->
        <path d="M-42,-215 C-18,-228 18,-228 42,-215 L42,-192 C18,-182 -18,-182 -42,-192 Z" fill="#173D32" stroke="#0E2720" stroke-width="2" />
        <!-- Center placket -->
        <rect x="-10" y="-190" width="20" height="360" fill="#173D32" stroke="#0E2720" stroke-width="1.2" opacity="0.7" />
        <!-- Pearl buttons -->
        <circle cx="0" cy="-160" r="3.5" fill="#B99A61" />
        <circle cx="0" cy="-105" r="3.5" fill="#B99A61" />
        <circle cx="0" cy="-50" r="3.5" fill="#B99A61" />
        <circle cx="0" cy="5" r="3.5" fill="#B99A61" />
        <circle cx="0" cy="60" r="3.5" fill="#B99A61" />
        <circle cx="0" cy="115" r="3.5" fill="#B99A61" />
      </g>
    
  </g>
  <text x="400" y="555" text-anchor="middle" font-family="Georgia, serif" font-size="11" letter-spacing="4" fill="#173D32" opacity="0.45">SHIRTS</text>
