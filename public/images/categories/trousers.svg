<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="studioLight" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FAF8F3" />
      <stop offset="100%" stop-color="#EAE3D5" />
    </radialGradient>
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 4 H8 M4 0 V8" stroke="#173D32" stroke-width="0.35" opacity="0.06" />
    </pattern>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#173D32" flood-opacity="0.14" />
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#studioLight)" />
  <rect width="800" height="600" fill="url(#weave)" />
  <rect x="28" y="28" width="744" height="544" fill="none" stroke="#173D32" stroke-opacity="0.08" stroke-width="1" />
  <g filter="url(#softShadow)">
    
      <g transform="translate(400, 315) scale(0.75)">
        <!-- Waistband -->
        <rect x="-96" y="-215" width="192" height="28" fill="#173D32" stroke="#0E2720" stroke-width="2" />
        <!-- Legs with double pleats -->
        <path d="M-96,-187 L96,-187 L108,215 L36,215 L0,-50 L-36,215 L-108,215 Z"
              fill="#173D32" stroke="#0E2720" stroke-width="2" />
        <!-- Crease & pleats -->
        <line x1="-58" y1="-185" x2="-68" y2="210" stroke="#0E2720" stroke-width="1.4" opacity="0.5" />
        <line x1="-42" y1="-185" x2="-46" y2="-130" stroke="#0E2720" stroke-width="1.4" opacity="0.6" />
        <line x1="58" y1="-185" x2="68" y2="210" stroke="#0E2720" stroke-width="1.4" opacity="0.5" />
        <line x1="42" y1="-185" x2="46" y2="-130" stroke="#0E2720" stroke-width="1.4" opacity="0.6" />
        <!-- Side tab brass buckle -->
        <rect x="-92" y="-206" width="18" height="10" fill="none" stroke="#B99A61" stroke-width="2" />
        <rect x="74" y="-206" width="18" height="10" fill="none" stroke="#B99A61" stroke-width="2" />
      </g>
    
  </g>
  <text x="400" y="555" text-anchor="middle" font-family="Georgia, serif" font-size="11" letter-spacing="4" fill="#173D32" opacity="0.45">TROUSERS</text>
</svg>