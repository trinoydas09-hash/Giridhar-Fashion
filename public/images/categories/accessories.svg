    </pattern>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#173D32" flood-opacity="0.14" />
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#studioLight)" />
  <rect width="800" height="600" fill="url(#weave)" />
  <rect x="28" y="28" width="744" height="544" fill="none" stroke="#173D32" stroke-opacity="0.08" stroke-width="1" />
  <g filter="url(#softShadow)">
    
      <g transform="translate(400, 310) scale(0.75)">
        <ellipse cx="0" cy="0" rx="145" ry="110" fill="none" stroke="#173D32" stroke-width="34" />
        <ellipse cx="0" cy="0" rx="145" ry="110" fill="none" stroke="#0E2720" stroke-width="2" />
        <ellipse cx="0" cy="0" rx="128" ry="93" fill="none" stroke="#0E2720" stroke-width="1.5" />
        <!-- Brass Buckle -->
        <rect x="-170" y="-28" width="52" height="56" rx="4" fill="none" stroke="#B99A61" stroke-width="9" />
        <line x1="-145" y1="0" x2="-115" y2="0" stroke="#B99A61" stroke-width="5" stroke-linecap="round" />
      </g>
    
  </g>
  <text x="400" y="555" text-anchor="middle" font-family="Georgia, serif" font-size="11" letter-spacing="4" fill="#173D32" opacity="0.45">ACCESSORIES</text>
